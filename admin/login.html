<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VAST Admin Login</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>

<body>

    <main class="admin-login">

        <div class="login-card">

            <div class="login-logo">

                <img
                    src="../assests/images/VAST LOGO.png"
                    alt="VAST Security Group"
                >

            </div>


            <h1>Admin Portal</h1>

            <p class="login-subtitle">
                VAST Security Group
            </p>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-controls="password"
                        aria-pressed="false"
                    >
                        Show
                    </button>

                </div>

                <button
                    type="button"
                    id="forgotPasswordBtn"
                    class="password-toggle"
                >
                    Forgot password?
                </button>


                <button
                    type="submit"
                    class="admin-login-btn"
                >
                    Sign In
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../backend/auth/login.js"></script>

</body>

</html>
