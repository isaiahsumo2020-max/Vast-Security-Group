<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log | VAST Admin</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <img src="../../assests/images/VAST LOGO.png" alt="VAST Logo">
                <div><strong>VAST</strong><span>ADMIN</span></div>
            </div>
            <nav class="admin-nav" aria-label="Admin navigation">
                <a href="../dashboard.html">Dashboard</a>
                <a href="../administrators/administrators.html">Administrators</a>
                <a href="../posts/posts.html">Guard Posts</a>
                <a href="../clients/clients.html">Clients</a>
                <a href="../officers/officers.html">Officers</a>
                <a href="../recruitment/recruitment.html">Recruitment</a>
                <a href="../shortlist/shortlist.html">Shortlist</a>
                <a href="../communication/communication.html">Communication</a>
                <a href="../messages/messages.html">Messages</a>
                <a href="../notifications/notifications.html">Notifications</a>
                <a href="../services/services.html">Services</a>
                <a href="auditlog.html" class="active" aria-current="page">Audit Log</a>
                <a href="../settings/settings.html">Settings</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1>Audit Log</h1>
                    <p>Review recent administrative changes and who performed them.</p>
                </div>
                <button type="button" class="secondary-btn" id="refreshAuditBtn">Refresh</button>
            </header>
            <section class="admin-section">
                <div class="officer-controls">
                    <label class="officer-search" for="auditSearch">
                        <span class="visually-hidden">Search audit log</span>
                        <input type="search" id="auditSearch" placeholder="Search actor, action, or record">
                    </label>
                    <label for="auditEntityFilter">
                        <span class="visually-hidden">Filter by record type</span>
                        <select id="auditEntityFilter">
                            <option value="">All record types</option>
                        </select>
                    </label>
                </div>
                <p id="auditStatus" class="form-message" role="status" aria-live="polite"></p>
                <div class="officer-table-wrapper">
                    <table class="officer-table">
                        <thead>
                            <tr>
                                <th scope="col">Date and time</th>
                                <th scope="col">Administrator</th>
                                <th scope="col">Action</th>
                                <th scope="col">Record</th>
                                <th scope="col">Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody">
                            <tr><td colspan="5">Loading audit log…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../auth/guard.js"></script>
    <script type="module" src="./auditlog.js"></script>
</body>
</html>
