<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | VAST Admin</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <img src="../../assests/images/VAST LOGO.png" alt="VAST Logo">
                <div><strong>VAST</strong><span>ADMIN</span></div>
            </div>
            <nav class="admin-nav" aria-label="Admin navigation">
                <a href="../dashboard.html">Dashboard</a>
                <a href="../administrators/administrators.html">Administrators</a>
                <a href="../posts/posts.html">Guard Posts</a>
                <a href="../clients/clients.html">Clients</a>
                <a href="../officers/officers.html">Officers</a>
                <a href="../recruitment/recruitment.html">Recruitment</a>
                <a href="../shortlist/shortlist.html">Shortlist</a>
                <a href="../communication/communication.html">Communication</a>
                <a href="../messages/messages.html">Messages</a>
                <a href="notifications.html" class="active" aria-current="page">Notifications</a>
                <a href="../services/services.html">Services</a>
                <a href="../auditlog/auditlog.html">Audit Log</a>
                <a href="../settings/settings.html">Settings</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1>Notifications</h1>
                    <p>Review updates and alerts for your administrator account.</p>
                </div>
                <button type="button" class="secondary-btn" id="markAllReadBtn">Mark all as read</button>
            </header>
            <section class="admin-section">
                <div class="notification-page-controls">
                    <label for="notificationFilter">Show
                        <select id="notificationFilter">
                            <option value="all">All notifications</option>
                            <option value="unread">Unread</option>
                            <option value="read">Read</option>
                        </select>
                    </label>
                    <p id="notificationSummary" aria-live="polite"></p>
                </div>
                <p id="notificationPageStatus" class="form-message" role="status" aria-live="polite"></p>
                <div id="notificationPageList" class="admin-notification-page-list" aria-live="polite">
                    <p>Loading notifications…</p>
                </div>
                <nav class="notification-pagination" aria-label="Notification pages">
                    <button type="button" class="secondary-btn" id="previousNotificationsBtn" disabled>Previous</button>
                    <span id="notificationPageIndicator">Page 1</span>
                    <button type="button" class="secondary-btn" id="nextNotificationsBtn" disabled>Next</button>
                </nav>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../auth/guard.js"></script>
    <script type="module" src="./notifications.js"></script>
</body>
</html>
