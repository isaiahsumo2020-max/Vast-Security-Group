<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password | VAST Security Group</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <main class="admin-login">
        <div class="login-card">
            <div class="login-logo">
                <img src="../assests/images/VAST LOGO.png" alt="VAST Security Group">
            </div>

            <h1>Reset Password</h1>
            <p class="login-subtitle">Choose a new password for your admin account.</p>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input
                        type="password"
                        id="newPassword"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="admin-login-btn" id="resetPasswordBtn">
                    Update Password
                </button>

                <p id="resetPasswordMessage" class="login-message" role="status" aria-live="polite"></p>
                <p class="login-message">
                    <a href="./login.html">Return to admin sign in</a>
                </p>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../backend/auth/resetPassword.js"></script>
</body>

</html>
